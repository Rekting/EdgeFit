name: Bug report
description: Report an EdgeFit problem
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: EdgeFit version
      placeholder: e.g. 1.1.9.2
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Windows architecture
      options:
        - x64
        - ARM64
        - Unknown
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
